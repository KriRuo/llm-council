name: Security Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit pip-audit
          pip install fastapi uvicorn python-dotenv httpx pydantic slowapi
      
      - name: Run Safety check (Python CVE scanning)
        run: safety check --json || true
        continue-on-error: true
      
      - name: Run Bandit (Python security linter)
        run: bandit -r backend/ -f json -o bandit-report.json || true
        continue-on-error: true
      
      - name: Display Bandit results
        if: always()
        run: |
          if [ -f bandit-report.json ]; then
            echo "Bandit found the following issues:"
            cat bandit-report.json
          fi
      
      - name: Run pip-audit (dependency vulnerability scanner)
        run: pip-audit --desc || true
        continue-on-error: true
      
      - name: Frontend npm audit
        working-directory: frontend
        run: |
          npm install
          npm audit --audit-level=moderate || true
        continue-on-error: true
      
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          if-no-files-found: ignore
